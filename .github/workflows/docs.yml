name: Publish API docs

on:
  push:
    branches: [master]
    paths:
      - "docs/openapi.yaml"
      - "docs/swagger/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml

      - name: Build Redoc page
        run: |
          mkdir -p _site/redoc
          npx --yes @redocly/cli@latest build-docs docs/openapi.yaml -o _site/redoc/index.html
          cp docs/openapi.yaml _site/openapi.yaml

      - name: Add Swagger UI (Try it out)
        run: |
          npm install --no-save swagger-ui-dist
          cp docs/swagger/index.html _site/index.html
          cp node_modules/swagger-ui-dist/swagger-ui.css node_modules/swagger-ui-dist/swagger-ui-bundle.js _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
